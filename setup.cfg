[metadata]
name = auth-middleware
version = attr: auth_middleware.__version__
author = Dev Wazobia
author_email = developer@wazobia.tech
description = Authentication middleware for Python services with JWT and Project authentication
long_description = file: README.md
long_description_content_type = text/markdown
url = https://bitbucket.org/yourworkspace/auth-middleware-python
project_urls =
    Bug Tracker = https://bitbucket.org/yourworkspace/auth-middleware-python/issues
    Documentation = https://bitbucket.org/yourworkspace/auth-middleware-python/wiki
classifiers =
    Development Status :: 5 - Production/Stable
    Intended Audience :: Developers
    Topic :: Software Development :: Libraries :: Python Modules
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Operating System :: OS Independent

[options]
packages = find:
python_requires = >=3.8
install_requires =
    redis>=4.5.0
    requests>=2.28.0
    PyJWT>=2.8.0
    cryptography>=41.0.0
    python-jose[cryptography]>=3.3.0
    flask>=2.3.0
    fastapi>=0.100.0
    graphene>=3.3

[options.packages.find]
exclude =
    tests
    tests.*

[options.extras_require]
dev =
    pytest>=7.4.0
    pytest-asyncio>=0.21.0
    pytest-mock>=3.11.0
    pytest-cov>=4.1.0
    black>=23.0.0
    flake8>=6.0.0
    mypy>=1.4.0
    build>=0.10.0
    twine>=4.0.0

[flake8]
max-line-length = 100
exclude = .git,__pycache__,build,dist
ignore = E203, W503

[mypy]
python_version = 3.8
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True